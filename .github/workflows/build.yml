name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # - uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest

    container:
      image: python:2.7

    steps:
      - uses: actions/checkout@v4

      - name: Show Python version
        run: |
          python --version
          pip --version

      - name: Install system dependencies
        # Mirrors docker/Dockerfile: Debian buster is EOL, so its repos
        # moved to archive.debian.org.
        run: |
          sed -i \
            -e 's|deb.debian.org/debian |archive.debian.org/debian |g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            git \
            libpq-dev \
            libjpeg-dev \
            zlib1g-dev \
            libxml2-dev \
            libxslt1-dev \
            libffi-dev \
            libssl-dev \
            flite

      - name: Install basic requirements
        # psycopg2==2.6 can't parse the version string of any libpq newer
        # than 9.x, so it fails to build against this base image. Same fix
        # as docker/Dockerfile: use psycopg2-binary instead, without
        # touching the project's actual requirements files.
        run: |
          pip install --no-cache-dir psycopg2-binary==2.8.6 six==1.9.0
          grep -v '^psycopg2==' requirements/basic.txt > /tmp/basic-ci.txt
          pip install --no-cache-dir -r /tmp/basic-ci.txt

      - name: Install django requirements
        # Same two fixes as docker/Dockerfile:
        #  1. git+http://github.com/pinax/django-mailer has no ref, so it
        #     always resolves to current master - which has moved to a
        #     PEP 517 build requiring setuptools>=61.2 and no longer
        #     installs under Python 2.7. Pin it to tag 1.2.6, the last
        #     pre-Python3-only release.
        #  2. django-qsstats-magic (pulled in transitively by
        #     django-admin-tools-stats==0.5.5) isn't pinned, so pip
        #     resolves 1.1.0 - which does
        #     `from django.db.models.functions import Trunc`, a module
        #     that doesn't exist before Django 1.8. That 500s every
        #     request to /admin/ on this project's Django 1.7.7. Pin
        #     0.7.2, the last release before that import was introduced.
        run: |
          sed -e 's#git+http://github.com/pinax/django-mailer#git+http://github.com/pinax/django-mailer@1.2.6#' \
            requirements/django.txt > /tmp/django-ci.txt
          pip install --no-cache-dir -r /tmp/django-ci.txt
          pip install --no-cache-dir --no-deps six==1.9.0 django-qsstats-magic==0.7.2

      - name: Install test dependencies
        # rudolf==0.3 (the nose --with-color plugin) ships a malformed
        # install_requires ("nose==dev,>=0.1.0") on PyPI that pip can't
        # parse. Pre-install a sane nose and skip rudolf's own broken
        # dependency resolution.
        #
        # pytest==2.6.4 checks py's version with a *string* comparison
        # (py.__version__.split(".")[:2] >= ['1', '4']), so any py release
        # with a two-digit minor (e.g. 1.11.0, pulled in unpinned by
        # pytest-xdist) fails since '11' < '4' lexicographically. Pin the
        # last 1.4.x release, which still satisfies pytest-xdist's
        # py>=1.4.25 floor.
        run: |
          pip install --no-cache-dir nose==1.3.7 py==1.4.31
          grep -v '^rudolf==' requirements/test.txt > /tmp/test-ci.txt
          pip install --no-cache-dir --no-deps rudolf==0.3
          pip install --no-cache-dir -r /tmp/test-ci.txt

      - name: Install project
        run: |
          pip install -e .

      - name: Apply runtime compatibility shims
        # Same fix as docker/Dockerfile's sitecustomize.py: kombu==3.0.24
        # does `from uuid import _uuid_generate_random`, an attribute
        # provided by the legacy uuid==1.30 PyPI backport (also pinned in
        # basic.txt) - but Python 2.7's stdlib uuid module always wins on
        # sys.path and has no such attribute, so importing kombu/celery
        # fails on any modern Python 2.7.
        run: |
          printf 'import uuid\nif not hasattr(uuid, "_uuid_generate_random"):\n    uuid._uuid_generate_random = None\n' \
            > /usr/local/lib/python2.7/site-packages/sitecustomize.py

      - name: Create database directory
        run: |
          mkdir -p newfies/database

      - name: Run tests
        # --verbosity=2, --with-xtraceback and --with-color are nose flags
        # (see newfies/runtests.py's usage comment, written for the old
        # `manage.py test` nose-based runner) - py.test doesn't recognize
        # them and no installed plugin registers them for pytest either.
        # pytest's own verbosity flag is -v.
        env:
          DJANGO_SETTINGS_MODULE: newfies_dialer.settings_test
        run: |
          py.test newfies/ -v -s
