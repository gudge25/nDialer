name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # - uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest

    container:
      image: python:2.7

    steps:
      - uses: actions/checkout@v4

      - name: Show Python version
        run: |
          python --version
          pip --version

      - name: Install system dependencies
        # Mirrors docker/Dockerfile: Debian buster is EOL, so its repos
        # moved to archive.debian.org.
        run: |
          sed -i \
            -e 's|deb.debian.org/debian |archive.debian.org/debian |g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            git \
            libpq-dev \
            libjpeg-dev \
            zlib1g-dev \
            libxml2-dev \
            libxslt1-dev \
            libffi-dev \
            libssl-dev \
            flite

      - name: Install basic requirements
        # psycopg2==2.6 can't parse the version string of any libpq newer
        # than 9.x, so it fails to build against this base image. Same fix
        # as docker/Dockerfile: use psycopg2-binary instead, without
        # touching the project's actual requirements files.
        run: |
          pip install --no-cache-dir psycopg2-binary==2.8.6 six==1.9.0
          grep -v '^psycopg2==' requirements/basic.txt > /tmp/basic-ci.txt
          pip install --no-cache-dir -r /tmp/basic-ci.txt

      - name: Install test dependencies
        run: |
          pip install -r requirements/test.txt

      - name: Install project
        run: |
          pip install -e .

      - name: Apply runtime compatibility shims
        # Same fix as docker/Dockerfile's sitecustomize.py: kombu==3.0.24
        # does `from uuid import _uuid_generate_random`, an attribute
        # provided by the legacy uuid==1.30 PyPI backport (also pinned in
        # basic.txt) - but Python 2.7's stdlib uuid module always wins on
        # sys.path and has no such attribute, so importing kombu/celery
        # fails on any modern Python 2.7.
        run: |
          printf 'import uuid\nif not hasattr(uuid, "_uuid_generate_random"):\n    uuid._uuid_generate_random = None\n' \
            > /usr/local/lib/python2.7/site-packages/sitecustomize.py

      - name: Create database directory
        run: |
          mkdir -p newfies/database

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: newfies_dialer.settings_test
        run: |
          py.test newfies/ --verbosity=2 -s --with-xtraceback --with-color
