# Full stack: nginx + Django (gunicorn) + Celery worker/beat + Postgres +
# Redis + FreeSWITCH. FreeSWITCH runs with network_mode: host (SIP/RTP need
# real host ports, not NAT'd bridge ports), so it must be built and started
# separately from the rest:
#   docker compose build freeswitch && docker compose up -d freeswitch
#   docker compose build && docker compose up -d
# The app image's Dockerfile does `COPY --from=newfies-freeswitch:v1.4` (the
# ESL Python bindings) at build time, so `freeswitch` must be built first.

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: newfies-dialer:latest
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - static_data:/usr/share/newfies/static
    - media_data:/usr/share/newfies/usermedia
  # FreeSWITCH runs with network_mode: host (see below), so from these
  # bridge-network containers it's reachable at host.docker.internal -
  # needs an explicit gateway alias on Linux (Docker Desktop provides this
  # automatically, native Linux engines don't).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  db:
    image: postgres:9.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newfies}
      POSTGRES_USER: ${POSTGRES_USER:-newfies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Published to the host's loopback only (not 0.0.0.0) so the
    # host-networked freeswitch container can reach it at 127.0.0.1:5432
    # for listener.lua's direct luasql.postgres connection - not for
    # access from outside this machine.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newfies}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app-image
    command: ["gunicorn", "newfies_dialer.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120"]

  celery_worker:
    <<: *app-image
    environment:
      RUN_MIGRATIONS: "false"
      # CELERY_ACCEPT_CONTENT includes pickle (settings.py); celery refuses
      # to run as root with pickle enabled unless this is set.
      C_FORCE_ROOT: "1"
    command: ["python", "manage.py", "celery", "worker", "-l", "info", "--without-mingle", "--autoscale=10,2"]

  celery_beat:
    <<: *app-image
    environment:
      RUN_MIGRATIONS: "false"
    command: ["python", "manage.py", "celery", "beat", "-l", "info"]

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/usr/share/newfies/static:ro
      - media_data:/usr/share/newfies/usermedia:ro
    restart: unless-stopped

  freeswitch:
    build:
      context: .
      dockerfile: docker/freeswitch/Dockerfile
    image: newfies-freeswitch:v1.4
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 127.0.0.1 because network_mode: host - db is published to the
      # host's loopback above for exactly this.
      DBHOST: 127.0.0.1
      DBPORT: 5432
      DBNAME: ${POSTGRES_DB:-newfies}
      DBUSER: ${POSTGRES_USER:-newfies}
      DBPASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ESL_SECRET: ${ESL_SECRET:?set ESL_SECRET in .env - it is reachable beyond localhost here}
      ESL_LISTEN_IP: 0.0.0.0
      TTS_ENGINE: ${TTS_ENGINE:-flite}
    volumes:
      - freeswitch_recordings:/usr/local/freeswitch/recordings
      - freeswitch_db:/usr/local/freeswitch/db
      # lua/libs/constant.lua hardcodes UPLOAD_DIR/FS_RECORDING_PATH to
      # /usr/share/newfies/usermedia/ - the same path Django's MEDIA_ROOT
      # uses. Campaign greeting audio is uploaded via the Django app into
      # this volume, and FreeSWITCH (a separate container) needs to read
      # it from the exact same path, or session:streamFile() finds
      # nothing and the call flow falls through instead of playing it.
      # Read-write since FreeSWITCH also writes call recordings here.
      - media_data:/usr/share/newfies/usermedia
      # Gateway/trunk config. Note the real path is /etc/freeswitch/... ,
      # not /usr/local/freeswitch/conf/... - this image sets
      # --sysconfdir=/etc/freeswitch, which is what FreeSWITCH actually
      # reads at runtime; /usr/local/freeswitch/conf/ only applies to a
      # vanilla build without a custom sysconfdir. Drop gateway XML files
      # (e.g. call-labs.xml) in ./freeswitch-conf/sip_profiles/external/ on
      # the host, then `fs_cli -x reloadxml` or restart this container.
      - ./freeswitch-conf/sip_profiles/external:/etc/freeswitch/sip_profiles/external
    restart: unless-stopped

volumes:
  freeswitch_recordings:
  freeswitch_db:
  postgres_data:
  redis_data:
  static_data:
  media_data:
